spring.application.name=backend-test

# JPA / Hibernate para ambiente de testes automatizados
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# As migrations 19 e 20 populam o catálogo demonstrativo usado localmente e em
# produção. Os testes de integração criam seus próprios dados e pressupõem uma
# base vazia, portanto executam o esquema até a última migration estrutural.
spring.flyway.enabled=true
spring.flyway.target=18

# Desabilita endpoints do Swagger/OpenAPI durante os testes (evita warnings no log)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
