spring.application.name=backend-test

# JPA / Hibernate para ambiente de testes automatizados
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway ativo para validar todas as migrations nos testes
spring.flyway.enabled=true

# Desabilita endpoints do Swagger/OpenAPI durante os testes (evita warnings no log)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
