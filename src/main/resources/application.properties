spring.application.name=backend

# Banco de dados (valores padrão batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendaja}
spring.datasource.username=${DB_USERNAME:agendaja}
spring.datasource.password=${DB_PASSWORD:agendaja}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
