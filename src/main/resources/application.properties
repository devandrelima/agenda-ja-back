spring.application.name=backend

# Banco de dados (valores padrão batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendaja}
spring.datasource.username=${DB_USERNAME:agendaja}
spring.datasource.password=${DB_PASSWORD:agendaja}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# Logging
logging.level.org.springframework.security=DEBUG

# Servidor SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Timeouts de conexão e envio
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente
app.mail.from=${MAIL_FROM:no-reply@agendaja.local}

# Página de redefinição do frontend
app.frontend.password-reset-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/redefinir-senha}


